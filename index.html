<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>12-Week Workout Checklist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap');

:root {
  --push:   #D94F2B; --push-bg:   #FDF0EE;
  --pull:   #2B6ED9; --pull-bg:   #EEF4FB;
  --legs:   #2B8C3D; --legs-bg:   #EEF7EE;
  --upper:  #7B3FBE; --upper-bg:  #F4EEFB;
  --cardio: #C27A00; --cardio-bg: #FDF6E3;
  --rest:   #3A6B8A; --rest-bg:   #EEF3F7;
  --lb:     #B03060;
  --ink:    #111;
  --muted:  #666;
  --border: #E2E8F0;
  --light:  #F8FAFC;
  --white:  #fff;
  --green:  #16A34A;
  --mono:   'Space Mono', monospace;
  --sans:   'Inter', system-ui, sans-serif;
  --accent: var(--push);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--light);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 60px;
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-font-smoothing: antialiased;
}

/* ── TOP BAR ── */
.topbar {
  background: #0A0A0A;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.4);
}
.topbar-title { color: #fff; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
.topbar-sub   { color: #555; font-size: 11px; margin-top: 1px; }
.overall-wrap { text-align: right; }
.overall-pct  { color: #fff; font-size: 20px; font-weight: 800; font-family: var(--mono); line-height: 1; }
.overall-lbl  { color: #444; font-size: 10px; margin-top: 1px; }
.overall-bar-wrap { height: 3px; background: #1E1E1E; border-radius: 3px; margin-top: 6px; width: 120px; }
.overall-bar  { height: 100%; background: linear-gradient(90deg,#2B6ED9,#7B3FBE); border-radius: 3px; transition: width .4s; }

/* ── DATE NAV ── */
.date-nav {
  background: var(--white);
  border-bottom: 1.5px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--white);
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  transition: all .15s;
  flex-shrink: 0;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn:disabled { opacity: .3; cursor: not-allowed; }
.date-info { flex: 1; min-width: 0; }
.date-main { font-weight: 700; font-size: 15px; color: var(--ink); line-height: 1.2; }
.date-sub  { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }
.today-btn {
  padding: 6px 12px;
  border-radius: 7px;
  border: 1.5px solid var(--accent);
  background: var(--white);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--sans);
  white-space: nowrap;
  flex-shrink: 0;
  transition: all .15s;
}
.today-btn:hover { background: var(--accent); color: #fff; }

/* ── WEEK MINI STRIP ── */
.week-strip {
  background: var(--white);
  border-bottom: 1.5px solid var(--border);
  padding: 8px 20px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.week-strip::-webkit-scrollbar { display: none; }
.strip-day {
  flex: 0 0 auto;
  width: 42px;
  padding: 6px 4px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all .15s;
}
.strip-day:hover { border-color: var(--border); }
.strip-day.active { border-color: var(--accent); background: var(--accent); }
.strip-day.active .strip-label,
.strip-day.active .strip-date { color: #fff; }
.strip-day.has-progress .strip-dot { opacity: 1; }
.strip-label { font-size: 9px; font-weight: 600; color: var(--muted); line-height: 1; }
.strip-date  { font-size: 13px; font-weight: 700; color: var(--ink); margin-top: 2px; line-height: 1; }
.strip-dot   { width: 4px; height: 4px; border-radius: 50%; background: var(--green); margin: 3px auto 0; opacity: 0; }

/* ── CONTENT ── */
.content { max-width: 620px; margin: 0 auto; padding: 16px 16px 0; }

/* ── DAY HEADER CARD ── */
.day-header {
  border-radius: 12px 12px 0 0;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.dh-left h2  { color: #fff; font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.dh-left .dh-tag { color: rgba(255,255,255,.65); font-size: 12px; margin-top: 4px; }
.dh-right    { text-align: right; flex-shrink: 0; }
.dh-pct      { color: #fff; font-size: 28px; font-weight: 800; font-family: var(--mono); line-height: 1; }
.dh-sets     { color: rgba(255,255,255,.6); font-size: 11px; margin-top: 2px; }
.day-progress-bar { height: 4px; }
.day-progress-fill { height: 100%; transition: width .3s; border-radius: 0 2px 0 0; }

/* ── PHASE / WEEK NOTE ── */
.phase-note {
  background: var(--white);
  border-left: 4px solid var(--accent);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.phase-note-label { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--accent); margin-bottom: 3px; }
.phase-note-text  { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.week-note {
  background: #FFFDF0;
  border-bottom: 1px solid #F0E8C0;
  padding: 10px 14px;
  font-size: 12.5px;
  color: #7A6200;
  line-height: 1.5;
}
.week-note b { color: #5A4800; }

/* ── DONE BANNER ── */
.done-banner {
  display: none;
  background: #DCFCE7;
  border-bottom: 1px solid #86EFAC;
  padding: 12px 16px;
  text-align: center;
  font-weight: 700;
  font-size: 14px;
  color: var(--green);
}
.done-banner.show { display: block; }

/* ── SECTION BLOCKS ── */
.section-block {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
}
.section-block-title {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* ── PROTOCOL ITEMS ── */
.proto-item { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-bottom: 1px solid #F5F5F5; }
.proto-item:last-child { border-bottom: none; }
.proto-cb {
  width: 20px; height: 20px;
  border-radius: 5px;
  border: 2px solid var(--border);
  background: var(--white);
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
  margin-top: 1px;
}
.proto-cb.checked { background: var(--green); border-color: var(--green); }
.proto-cb.checked::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 800; }
.proto-text { font-size: 13px; color: var(--ink); line-height: 1.4; flex: 1; }
.proto-text .proto-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.lb-pain-row { display: flex; align-items: center; gap: 8px; padding: 8px 0 0; }
.lb-pain-row label { font-size: 12px; font-weight: 600; color: var(--muted); }
.lb-pain-input {
  width: 52px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 13px;
  font-family: var(--mono);
  text-align: center;
  background: var(--light);
}
.lb-pain-input:focus { outline: none; border-color: var(--lb); }

/* ── EXERCISE CARDS ── */
.ex-card {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
}
.ex-card:last-child { border-bottom: none; }
.ex-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.ex-name { font-weight: 700; font-size: 14px; color: var(--ink); line-height: 1.3; flex: 1; }
.ex-tgt-badge {
  background: #EDE8F7;
  color: var(--upper);
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
  white-space: nowrap;
}
.ex-meta  { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
.ex-note  { font-size: 11.5px; color: var(--muted); font-style: italic; margin-bottom: 10px; line-height: 1.4; }
.ex-prog  { font-size: 12px; font-weight: 700; white-space: nowrap; padding-top: 2px; flex-shrink: 0; margin-left: 8px; }
.ex-prog.done { color: var(--green); }

/* ── SET GRID ── */
.sets-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.set-item  { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.set-cb {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 2px solid var(--border);
  background: var(--white);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.set-cb:hover { border-color: var(--accent); transform: scale(1.05); }
.set-cb.checked { background: var(--green); border-color: var(--green); box-shadow: 0 2px 8px rgba(22,163,74,.3); }
.set-cb.checked::after { content: '✓'; color: #fff; font-size: 15px; font-weight: 800; }
.set-label { font-size: 9px; color: #CBD5E1; font-weight: 600; font-family: var(--mono); }
.set-weight {
  width: 46px;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  padding: 2px 4px;
  font-size: 10px;
  font-family: var(--mono);
  text-align: center;
  background: var(--light);
}
.set-weight:focus { outline: none; border-color: var(--accent); background: var(--white); }
.set-weight::placeholder { color: #CBD5E1; }

/* ── SESSION LOG ── */
.session-log { background: var(--white); border-top: 2px solid var(--border); padding: 14px 16px; border-radius: 0 0 12px 12px; }
.session-log h4 { font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
.log-row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.log-field { display: flex; flex-direction: column; gap: 3px; }
.log-field label { font-size: 11px; font-weight: 600; color: var(--muted); }
.log-field input, .log-field textarea {
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  font-family: var(--sans);
  background: var(--light);
  color: var(--ink);
}
.log-field input:focus, .log-field textarea:focus { outline: none; border-color: var(--accent); background: var(--white); }
.log-field textarea { resize: vertical; min-height: 56px; font-size: 12.5px; }
.reset-btn {
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 7px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--sans);
  margin-top: 8px;
  transition: all .15s;
}
.reset-btn:hover { border-color: #EF4444; color: #EF4444; }

/* scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }

@media (max-width: 480px) {
  .dh-left h2 { font-size: 17px; }
  .dh-pct     { font-size: 22px; }
  .ex-name    { font-size: 13px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">12-Week Plan</div>
    <div class="topbar-sub">Sep 30 – Dec 22, 2026</div>
  </div>
  <div class="overall-wrap">
    <div class="overall-pct" id="overall-pct">0%</div>
    <div class="overall-lbl" id="overall-lbl">0 / 0 sets</div>
    <div class="overall-bar-wrap"><div class="overall-bar" id="overall-bar" style="width:0%"></div></div>
  </div>
</div>

<div class="date-nav">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">←</button>
  <div class="date-info">
    <div class="date-main" id="date-main"></div>
    <div class="date-sub"  id="date-sub"></div>
  </div>
  <button class="today-btn" onclick="goToday()">Today</button>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">→</button>
</div>

<div class="week-strip" id="week-strip"></div>

<div class="content" id="content"></div>

<script>
// ── PLAN DATA ─────────────────────────────────────────────────────────────────
const START = new Date(2026, 8, 30); // Sep 30 2026 (month is 0-indexed)

const PHASES = [
  { weeks:[1,2,3],   name:"Foundation",   detail:"12–15 reps · 65–70% effort · Goblet squat · Master LB protocol daily" },
  { weeks:[4,5,6],   name:"Hypertrophy",  detail:"10–12 reps · 70–75% · Add weight or reps each week" },
  { weeks:[7,8,9],   name:"Strength",     detail:"8–10 reps · 75–80% · Core brace on every compound · Wk 9 = deload" },
  { weeks:[10,11,12],name:"Peak",         detail:"6–10 reps · 80–85% · Final push · Test new maxes" },
];

const WEEK_NOTES = {
  1:  "Week 1 Start — log baseline weights for every exercise. Take measurements: scale weight, waist, chest, hips. LB protocol before every session.",

  3:  "Week 3 — final foundation week. First weigh-in + re-measure. How is the Nordic curl feeling?",
  4:  "Week 4 — Phase 2 begins. Drop to 10–12 reps, increase DB weight 5–10%. Transition goblet → DB front squat if LB is pain-free.",
  5:  "Week 5 — add 1 extra set per compound movement this week.",
  6:  "Mid-Point Check-In — weigh in, re-measure chest/waist/hips, log all strength numbers. How is lower back trending?",
  7:  "Week 7 — Phase 3 begins. Drop to 8–10 reps, increase weight again. Prioritize bracing on squats and RDLs.",
  8:  "Week 8 — aim for 4 full sets on all compounds. LB protocol is non-negotiable.",
  9:  "Deload Week — 60% of normal weights, 2 sets only. Focus on LB mobility and recovery. Extra walks.",
  10: "Week 10 — Phase 4 begins. Return to full load + 5–10% increase. Hardest block of the plan.",
  11: "Week 11 — optional: test a 5RM on key lifts. Record new benchmarks.",
  12: "Final Week — best effort every session. Schedule cholesterol panel + final measurements.",
};

const WEEKLY_PATTERN = [
  { type:"push",   label:"PUSH DAY 💪",   tag:"Chest · Shoulders · Triceps",       color:"--push",   bg:"--push-bg"   },
  { type:"cardio", label:"ZONE 2 🏃",      tag:"Heart Health · Fat Burn",            color:"--cardio", bg:"--cardio-bg" },
  { type:"pull",   label:"PULL DAY 🔵",   tag:"Back · Biceps · Rear Delts",         color:"--pull",   bg:"--pull-bg"   },
  { type:"rest",   label:"REST + LB 🧘",  tag:"McGill Big 3 · Mobility · Walk",     color:"--rest",   bg:"--rest-bg"   },
  { type:"legs",   label:"LEG DAY 🟢",    tag:"Quads · Hamstrings · Glutes · Calves",color:"--legs",  bg:"--legs-bg"   },
  { type:"upper",  label:"UPPER BODY 🟣", tag:"Compound Strength (Optional Day 5)", color:"--upper",  bg:"--upper-bg"  },
  { type:"cardio", label:"ZONE 2 🏃",      tag:"Heart Health · Fat Burn",            color:"--cardio", bg:"--cardio-bg" },
];

const LB_PROTO = [
  { key:"lb_catcamel",  text:"Cat-Camel",          sub:"10 slow cycles · 3 sec each end · Spine mobility warm-up" },
  { key:"lb_curlup",    text:"McGill Curl-Up",      sub:"5×10s / 3×10s / 1×10s · Hands under lumbar · Lift head/shoulders only" },
  { key:"lb_birddog",   text:"Bird Dog",            sub:"5×10s each side / 3×10s / 1×10s · All fours · Opposite arm + leg · Hips level" },
  { key:"lb_sideplank", text:"Side Plank",          sub:"5×10s each side / 3×10s / 1×10s · Knees bent to start · Progress to feet" },
  { key:"lb_bridge",    text:"Glute Bridge",        sub:"3 × 12–15 reps · Drive through heels · Squeeze glutes · Don't hyperextend" },
  { key:"lb_deadbug",   text:"Dead Bug",            sub:"3 × 8 each side · Low back PRESSED into floor · 3 sec descent" },
];

const WARMUP = [
  { key:"wu1", text:"Light movement 5 min",         sub:"Jumping jacks, march in place, or easy bike" },
  { key:"wu2", text:"Arm circles × 15 each way",    sub:"Loosen shoulders before pressing" },
  { key:"wu3", text:"Hip 90/90 mobility 60 sec ea", sub:"Essential for squat and hinge patterns" },
  { key:"wu4", text:"Bodyweight squats × 10",       sub:"Warm up the whole chain" },
  { key:"wu5", text:"Glute bridges × 10",           sub:"Activate glutes before lower body work" },
  { key:"wu6", text:"1 warm-up set at 50%",         sub:"First exercise only, feel the movement" },
];

const COOLDOWN = [
  { key:"cd1", text:"Hip flexor stretch",           sub:"30–45 sec each side · Couch stretch or kneeling" },
  { key:"cd2", text:"Hamstring stretch",            sub:"30–45 sec each side · Keep spine long" },
  { key:"cd3", text:"Chest / pec band stretch",     sub:"30 sec · Anchor band, open chest" },
  { key:"cd4", text:"Knee-to-chest",                sub:"30 sec each · Lower back decompression" },
  { key:"cd5", text:"Child's pose",                 sub:"45 sec · Let the spine decompress" },
  { key:"cd6", text:"10 slow deep breaths",         sub:"Diaphragmatic — lower HR and cortisol" },
];

// ── EXERCISE LIBRARY ──────────────────────────────────────────────────────────
// Format: { name, sets, reps, rest, target, note }
const EXERCISES = {
  push: [
    { name:"DB Bench Press (flat bench)",              sets:4, reps:"8–10",     rest:"90s", target:false, note:"Neutral or pronated grip · 3 sec eccentric · Full range of motion" },
    { name:"DB Incline Press (bench 30–45°)",          sets:3, reps:"10–12",    rest:"75s", target:false, note:"Upper chest focus · Elbows at 45° · Protect the shoulder joint" },
    { name:"Seated DB Shoulder Press",                 sets:3, reps:"10–12",    rest:"75s", target:false, note:"Sit upright on bench · Don't let elbows drift behind ears" },
    { name:"DB Lateral Raises",                        sets:3, reps:"12–15",    rest:"60s", target:false, note:"Slight forward lean · Lead with elbows, not hands · No swinging" },
    { name:"DB Overhead Tricep Extension",             sets:3, reps:"12–15",    rest:"60s", target:false, note:"Both hands grip one DB head · Elbows point forward · Full stretch" },
    { name:"Band Tricep Pushdown (anchor overhead)",   sets:3, reps:"15–20",    rest:"45s", target:false, note:"Loop band over door top · Elbows pinned to sides throughout" },
    { name:"DB Chest Fly — flat bench",                sets:3, reps:"12–15",    rest:"60s", target:true,  note:"★ Wide arc, slight elbow bend · Feel the pec stretch · Chest fat targeting" },
    { name:"DB Decline Press (bench 15–20°)",          sets:3, reps:"10–12",    rest:"75s", target:true,  note:"★ Lower chest emphasis · Don't go too steep on the bench" },
    { name:"DB Pullover (flat bench)",                 sets:3, reps:"12–15",    rest:"60s", target:true,  note:"★ Serratus + pec stretch · Slight bend in elbows · Controlled arc" },
    { name:"Band Chest Fly (anchor shoulder height)",  sets:3, reps:"15–20",    rest:"45s", target:true,  note:"★ Step forward for tension · Hug-a-tree motion · Hold squeeze at center" },
    { name:"Incline Push-Up (feet on bench, finisher)",sets:2, reps:"Max reps", rest:"45s", target:true,  note:"★ Upper chest emphasis · Full range · To controlled failure" },
  ],
  pull: [
    { name:"Band Lat Pulldown (anchor overhead)",          sets:4, reps:"10–12",    rest:"75s", target:false, note:"Loop band over door or pull-up bar · Drive elbows down to hips · Lean back slightly" },
    { name:"DB Bent-Over Row (both arms, bench brace)",    sets:4, reps:"10–12",    rest:"75s", target:false, note:"Hinge at hips · Neutral spine · Drive elbows back toward hip, not upward" },
    { name:"Single-Arm DB Row (brace on bench)",           sets:3, reps:"10–12 ea", rest:"60s", target:false, note:"Full stretch at bottom · Squeeze lat at top · Keep spine neutral" },
    { name:"Band Face Pull (anchor at eye height)",        sets:3, reps:"15–20",    rest:"60s", target:false, note:"Pull to forehead · Thumbs behind ears at end · Critical for shoulder health" },
    { name:"DB Chest-Supported Rear Delt Fly (incline)",   sets:3, reps:"12–15",    rest:"60s", target:false, note:"Lie chest-down on incline bench · Slight bend in elbows · Lead with elbows" },
    { name:"DB Curl (supinated grip)",                     sets:3, reps:"10–12",    rest:"60s", target:false, note:"Full extension at bottom · Supinate wrist as you curl · No swinging" },
    { name:"Hammer Curl (neutral grip)",                   sets:2, reps:"12–15",    rest:"60s", target:false, note:"Builds brachialis — arm thickness · Both together or alternating" },
  ],
  legs: [
    { name:"Goblet Squat (Wks 1–3) / DB Front Squat (Wks 4+)", sets:4, reps:"8–10",      rest:"120s", target:false, note:"Wks 1–3: one DB at chest. Wks 4+: two DBs at shoulders. Upright torso protects lumbar spine." },
    { name:"DB Romanian Deadlift (RDL)",                         sets:4, reps:"10–12",     rest:"90s",  target:false, note:"Hinge at hips · Slight knee bend · DBs track close to legs · Feel hamstring stretch · Neutral spine always" },

// ── BUILD 84-DAY SCHEDULE ─────────────────────────────────────────────────────
function buildSchedule() {
  const days = [];
  for (let week = 1; week <= 12; week++) {
    for (let d = 0; d < 7; d++) {
      const idx = (week - 1) * 7 + d;
      const date = new Date(START);
      date.setDate(START.getDate() + idx);
      const pat = WEEKLY_PATTERN[d];
      const phase = PHASES.find(p => p.weeks.includes(week));
      days.push({ date, week, dayOfWeek: d, idx, phase, ...pat });
    }
  }
  return days;
}

const SCHEDULE = buildSchedule();
const TOTAL_DAYS = SCHEDULE.length;

function dateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function loadState(key) {
  try { return JSON.parse(localStorage.getItem('plan_' + key) || '{}'); } catch { return {}; }
}
function saveState(key, state) {
  try { localStorage.setItem('plan_' + key, JSON.stringify(state)); } catch {}
}

// ── CURRENT DAY INDEX ─────────────────────────────────────────────────────────
let currentIdx = 0;

function findTodayIdx() {
  const today = new Date();
  today.setHours(0,0,0,0);
  for (let i = 0; i < SCHEDULE.length; i++) {
    const d = new Date(SCHEDULE[i].date);
    d.setHours(0,0,0,0);
    if (d.getTime() === today.getTime()) return i;
  }
  if (today < SCHEDULE[0].date) return 0;
  return SCHEDULE.length - 1;
}

// ── COUNTS ────────────────────────────────────────────────────────────────────
function countSets(day) {
  const exs = EXERCISES[day.type] || [];
  return exs.reduce((sum, ex) => sum + (typeof ex.sets === 'number' ? ex.sets : 1), 0);
}

function doneSets(key) {
  const s = loadState(key);
  return Object.keys(s).filter(k => k.startsWith('set_') && s[k] === true).length;
}

function allTotalSets() {
  return SCHEDULE.reduce((sum, d) => {
    if (d.type === 'rest') return sum;
    return sum + countSets(d);
  }, 0);
}

function allDoneSets() {
  return SCHEDULE.reduce((sum, d) => {
    if (d.type === 'rest') return sum;
    return sum + doneSets(dateKey(d.date));
  }, 0);
}

// ── OVERALL PROGRESS ──────────────────────────────────────────────────────────
function updateOverall() {
  const total = allTotalSets();
  const done  = allDoneSets();
  const pct   = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('overall-pct').textContent = pct + '%';
  document.getElementById('overall-lbl').textContent = `${done} / ${total} sets`;
  document.getElementById('overall-bar').style.width = pct + '%';
}

// ── WEEK STRIP ────────────────────────────────────────────────────────────────
function renderStrip() {
  const strip = document.getElementById('week-strip');
  const weekStart = Math.floor(currentIdx / 7) * 7;
  const days = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let html = '';
  for (let i = weekStart; i < Math.min(weekStart + 7, SCHEDULE.length); i++) {
    const day = SCHEDULE[i];
    const key = dateKey(day.date);
    const done = doneSets(key);
    const total = countSets(day);
    const isActive = i === currentIdx;
    const hasProg = done > 0;
    const accentColor = `var(${day.color})`;
    html += `<div class="strip-day${isActive?' active':''}${hasProg?' has-progress':''}"
      style="${isActive ? `background:${accentColor};border-color:${accentColor}` : ''}"
      onclick="goToIdx(${i})">
      <div class="strip-label" style="${isActive?'color:rgba(255,255,255,.7)':''}">${days[day.date.getDay()]}</div>
      <div class="strip-date" style="${isActive?'color:#fff':''}">${day.date.getDate()}</div>
      <div class="strip-dot" style="background:${done===total&&total>0?'#22C55E':accentColor}"></div>
    </div>`;
  }
  strip.innerHTML = html;
  // Scroll active into view
  const active = strip.querySelector('.active');
  if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth' });
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function render() {
  const day  = SCHEDULE[currentIdx];
  const key  = dateKey(day.date);
  const state = loadState(key);
  const exs  = EXERCISES[day.type] || [];
  const isRest = day.type === 'rest';
  const totalSetsDay = countSets(day);
  const doneDay = doneSets(key);
  const pct = totalSetsDay > 0 ? Math.round(doneDay / totalSetsDay * 100) : 0;
  const isDone = !isRest && doneDay === totalSetsDay && totalSetsDay > 0;

  const accentVar = day.color;
  document.documentElement.style.setProperty('--accent', `var(${accentVar})`);

  // Date nav header
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('date-main').textContent =
    `${dayNames[day.date.getDay()]}, ${months[day.date.getMonth()]} ${day.date.getDate()}`;
  document.getElementById('date-sub').textContent =
    `Week ${day.week} of 12  ·  Day ${currentIdx + 1} of 84  ·  ${day.label}`;

  document.getElementById('prev-btn').disabled = currentIdx === 0;
  document.getElementById('next-btn').disabled = currentIdx === TOTAL_DAYS - 1;

  // Main content
  let html = '';

  // Day header
  html += `<div style="background:var(${accentVar})">
    <div class="day-header">
      <div class="dh-left">
        <h2>${day.label}</h2>
        <div class="dh-tag">${day.tag}${!isRest ? '  ·  ' + (EXERCISES[day.type]||[]).reduce((s,e)=>s+(typeof e.sets==='number'?e.sets:1),0) + ' total sets' : ''}</div>
      </div>
      ${!isRest ? `<div class="dh-right">
        <div class="dh-pct">${pct}%</div>
        <div class="dh-sets">${doneDay}/${totalSetsDay}</div>
      </div>` : ''}
    </div>
    <div class="day-progress-bar" style="background:rgba(0,0,0,.2)">
      <div class="day-progress-fill" id="day-fill"
        style="width:${pct}%;background:${isDone?'#22C55E':'rgba(255,255,255,.5)'}"></div>
    </div>
  </div>`;

  // Done banner
  html += `<div class="done-banner${isDone?' show':''}" id="done-banner">
    🎉  Workout complete — great work today!
  </div>`;

  // Phase note
  html += `<div class="phase-note">
    <div class="phase-note-label">Phase ${['1','2','3','4'][PHASES.indexOf(day.phase)]} — ${day.phase.name}</div>
    <div class="phase-note-text">${day.phase.detail}</div>
  </div>`;

  // Week note
  html += `<div class="week-note"><b>Week ${day.week}:</b> ${WEEK_NOTES[day.week] || ''}</div>`;

  // Lower back protocol (non-rest days)
  if (!isRest) {
    html += `<div class="section-block">
      <div class="section-block-title" style="color:var(--lb)">LOWER BACK PROTOCOL — FIRST (10 min)</div>`;
    LB_PROTO.forEach(item => {
      const checked = !!state[item.key];
      html += `<div class="proto-item">
        <div class="proto-cb${checked?' checked':''}" onclick="toggleProto('${key}','${item.key}')"></div>
        <div class="proto-text">${item.text}<div class="proto-sub">${item.sub}</div></div>
      </div>`;
    });
    html += `<div class="lb-pain-row">
      <label>LB pain today (0–10):</label>
      <input class="lb-pain-input" type="number" min="0" max="10" placeholder="—"
        value="${state.lb_pain||''}" onchange="saveField('${key}','lb_pain',this.value)">
    </div>`;
    html += `</div>`;

    // Warm-up
    html += `<div class="section-block">
      <div class="section-block-title">WARM-UP (8 min)</div>`;
    WARMUP.forEach(item => {
      const checked = !!state[item.key];
      html += `<div class="proto-item">
        <div class="proto-cb${checked?' checked':''}" onclick="toggleProto('${key}','${item.key}')"></div>
        <div class="proto-text">${item.text}<div class="proto-sub">${item.sub}</div></div>
      </div>`;
    });
    html += `</div>`;
  }

  // Exercises
  exs.forEach((ex, ei) => {
    const n = typeof ex.sets === 'number' ? ex.sets : 1;
    const exDone = Array.from({length:n},(_,si)=>state[`set_${ei}_${si}`]===true).filter(Boolean).length;
    const exComplete = exDone === n;
    html += `<div class="ex-card">
      <div class="ex-top">
        <div class="ex-name">${ex.name}${ex.target?'<span class="ex-tgt-badge">★ TARGET</span>':''}</div>
        <div class="ex-prog${exComplete?' done':''}">${exDone}/${n}</div>
      </div>
      <div class="ex-meta">${n} sets · ${ex.reps} · rest ${ex.rest}</div>
      <div class="ex-note">${ex.note}</div>
      <div class="sets-grid">`;
    for (let si = 0; si < n; si++) {
      const setKey = `set_${ei}_${si}`;
      const wKey   = `w_${ei}_${si}`;
      const checked = state[setKey] === true;
      const wval = state[wKey] || '';
      html += `<div class="set-item">
        <div class="set-cb${checked?' checked':''}" onclick="toggleSet('${key}',${ei},${si})"></div>
        <div class="set-label">S${si+1}</div>
        <input class="set-weight" type="text" placeholder="lbs" value="${wval}"
          onchange="saveWeight('${key}',${ei},${si},this.value)">
      </div>`;
    }
    html += `</div></div>`;
  });

  // Cool-down (non-rest days)
  if (!isRest) {
    html += `<div class="section-block">
      <div class="section-block-title">COOL-DOWN (5 min)</div>`;
    COOLDOWN.forEach(item => {
      const checked = !!state[item.key];
      html += `<div class="proto-item">
        <div class="proto-cb${checked?' checked':''}" onclick="toggleProto('${key}','${item.key}')"></div>
        <div class="proto-text">${item.text}<div class="proto-sub">${item.sub}</div></div>
      </div>`;
    });
    html += `</div>`;
  }

  // Session log
  html += `<div class="session-log">
    <h4>SESSION LOG</h4>
    <div class="log-row">
      <div class="log-field">
        <label>Energy (1–10)</label>
        <input type="number" min="1" max="10" style="width:80px" placeholder="—"
          value="${state.log_energy||''}" onchange="saveField('${key}','log_energy',this.value)">
      </div>
      <div class="log-field">
        <label>Heaviest lift today</label>
        <input type="text" style="width:220px" placeholder="e.g. DB Bench 65s × 9"
          value="${state.log_lift||''}" onchange="saveField('${key}','log_lift',this.value)">
      </div>
    </div>
    <div class="log-field" style="width:100%">
      <label>Notes</label>
      <textarea style="width:100%" placeholder="How did it feel? Anything to adjust next session?"
        onchange="saveField('${key}','log_notes',this.value)">${state.log_notes||''}</textarea>
    </div>
    <button class="reset-btn" onclick="resetDay('${key}')">↺ Reset this day</button>
  </div>`;

  document.getElementById('content').innerHTML = html;
  renderStrip();
  updateOverall();
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function toggleSet(key, ei, si) {
  const s = loadState(key);
  const k = `set_${ei}_${si}`;
  s[k] = !s[k];
  saveState(key, s);
  render();
}

function toggleProto(key, field) {
  const s = loadState(key);
  s[field] = !s[field];
  saveState(key, s);
  // Just update that checkbox without full re-render
  const day = SCHEDULE[currentIdx];
  const exs = EXERCISES[day.type] || [];
  const totalSetsDay = countSets(day);
  const doneDay = doneSets(key);
  const pct = totalSetsDay > 0 ? Math.round(doneDay / totalSetsDay * 100) : 0;
  const isDone = doneDay === totalSetsDay && totalSetsDay > 0;
  // Update fill bar
  const fill = document.getElementById('day-fill');
  if (fill) { fill.style.width = pct + '%'; fill.style.background = isDone ? '#22C55E' : 'rgba(255,255,255,.5)'; }
  // Toggle checkbox
  const cbs = document.querySelectorAll(`[onclick="toggleProto('${key}','${field}')"]`);
  cbs.forEach(cb => cb.classList.toggle('checked', !!s[field]));
  updateOverall();
}

function saveWeight(key, ei, si, val) {
  const s = loadState(key);
  s[`w_${ei}_${si}`] = val;
  saveState(key, s);
}

function saveField(key, field, val) {
  const s = loadState(key);
  s[field] = val;
  saveState(key, s);
}

function resetDay(key) {
  if (!confirm('Reset all checkboxes and weights for this day?')) return;
  localStorage.removeItem('plan_' + key);
  render();
}

function navigate(dir) {
  const next = currentIdx + dir;
  if (next < 0 || next >= TOTAL_DAYS) return;
  currentIdx = next;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToIdx(idx) {
  currentIdx = idx;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToday() {
  currentIdx = findTodayIdx();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
currentIdx = findTodayIdx();
render();
</script>
